<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANJII OFFICIAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');

        :root {
            --accent: #b026ff;
            --bg-dark: #050508;
            --glass-bg: rgba(20, 20, 25, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(176, 38, 255, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(176, 38, 255, 0.08), transparent 25%);
            background-attachment: fixed;
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

        /* Typography & Utilities */
        .neon-text {
            color: #fff;
            text-shadow: 0 0 8px var(--accent), 0 0 20px var(--accent);
        }
        .text-accent { color: var(--accent); }
        
        /* Glassmorphism */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .btn-glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        .btn-glass:hover {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }

        /* Navbar */
        nav {
            position: fixed;
            top: 0; width: 100%;
            height: 70px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-radius: 0 0 16px 16px;
            border-bottom: 1px solid var(--accent);
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }

        .nav-left, .nav-right { display: flex; align-items: center; gap: 15px; }
        
        .hamburger {
            font-size: 24px;
            cursor: pointer;
            background: none; border: none; color: white;
            transition: 0.3s;
        }
        .hamburger:hover { color: var(--accent); text-shadow: 0 0 10px var(--accent); }

        .logo { font-size: 20px; font-weight: 800; letter-spacing: 2px; }

        .color-picker {
            width: 30px; height: 30px;
            border: none; border-radius: 50%;
            cursor: pointer; overflow: hidden;
            background: none;
        }
        .color-picker::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker::-webkit-color-swatch { border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; }

        /* Sidebar Menu */
        .sidebar {
            position: fixed;
            top: 0; left: -300px;
            width: 280px; height: 100vh;
            z-index: 999;
            transition: 0.4s ease;
            padding-top: 80px;
            display: flex; flex-direction: column;
            border-right: 1px solid var(--accent);
        }
        .sidebar.active { left: 0; }
        .sidebar-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(3px);
            z-index: 998; display: none;
        }
        .sidebar-overlay.active { display: block; }
        .menu-item {
            padding: 15px 25px;
            color: white; text-decoration: none;
            font-size: 16px; font-weight: 600;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
            cursor: pointer;
        }
        .menu-item:hover { background: rgba(176, 38, 255, 0.2); padding-left: 35px; color: var(--accent); }
        .menu-item i { width: 30px; }

        /* Main Content */
        main {
            margin-top: 90px;
            padding: 20px;
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin-left: auto; margin-right: auto;
        }

        /* Carousel */
        .carousel-container {
            width: 100%; aspect-ratio: 16/9;
            max-height: 400px;
            position: relative; overflow: hidden;
            border-radius: 16px; margin-bottom: 30px;
            border: 1px solid var(--accent);
            box-shadow: 0 0 20px rgba(176, 38, 255, 0.2);
        }
        .carousel-slide {
            width: 100%; height: 100%;
            display: none;
            background-size: cover; background-position: center;
            align-items: center; justify-content: center;
        }
        .carousel-slide.active { display: flex; animation: fade 1s ease; }
        @keyframes fade { from {opacity: 0.4} to {opacity: 1} }
        .carousel-text {
            background: rgba(0,0,0,0.6);
            padding: 20px; border-radius: 12px;
            text-align: center; backdrop-filter: blur(5px);
            border: 1px solid var(--glass-border);
        }

        /* Cards Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            padding: 20px;
            display: flex; flex-direction: column; gap: 15px;
            transition: transform 0.3s;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 5px 15px rgba(176, 38, 255, 0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .badge { background: rgba(176, 38, 255, 0.2); color: var(--accent); padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; border: 1px solid var(--accent); }
        
        /* Forms & Inputs */
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 14px; color: var(--text-muted); }
        .input-glass {
            width: 100%; padding: 12px;
            background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            border-radius: 8px; color: white; outline: none;
            transition: 0.3s;
        }
        .input-glass:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(176, 38, 255, 0.3); }

        /* Loading Screen */
        .loader-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: var(--bg-dark); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Floating Socials */
        .social-float {
            position: fixed; bottom: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 15px; z-index: 90;
        }
        .social-btn {
            width: 50px; height: 50px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; color: white; text-decoration: none;
            background: var(--glass-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            transition: 0.3s;
        }
        .social-btn:hover {
            background: var(--accent); transform: scale(1.1);
            box-shadow: 0 0 15px var(--accent);
        }

        /* Chat Widget */
        .chat-widget {
            position: fixed; bottom: 80px; right: 20px;
            width: 300px; height: 400px;
            display: none; flex-direction: column;
            z-index: 95;
            border: 1px solid var(--accent);
        }
        .chat-header { padding: 15px; background: rgba(0,0,0,0.5); border-bottom: 1px solid var(--glass-border); font-weight: bold; border-radius: 16px 16px 0 0; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; font-size: 14px; }
        .msg.user { background: var(--accent); align-self: flex-end; color: white; }
        .msg.admin { background: rgba(255,255,255,0.1); align-self: flex-start; }
        .chat-input { display: flex; padding: 10px; border-top: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); border-radius: 0 0 16px 16px; }
        .chat-input input { flex:1; background: transparent; border: none; color: white; outline: none; padding: 0 10px; }

        /* Utilities */
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .mt-2 { margin-top: 20px; }
        .mb-2 { margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--glass-border); }
        th { color: var(--accent); }

        /* QRIS Image */
        .qris-img { max-width: 100%; height: auto; border-radius: 12px; border: 2px dashed var(--accent); margin: 15px 0; }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
        <h2 class="neon-text" id="loader-text">MEMUAT...</h2>
    </div>

    <!-- Navbar -->
    <nav class="glass">
        <div class="nav-left">
            <button class="hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div class="logo neon-text" id="nav-logo">MANJII OFFICIAL</div>
        </div>
        <div class="nav-right">
            <input type="color" class="color-picker" id="colorPicker" value="#b026ff" onchange="changeAccentColor(event)" title="Ubah Warna Tema">
            <button class="btn-glass" id="auth-btn" onclick="navigate('auth')"><i class="fas fa-user"></i> Login</button>
        </div>
    </nav>

    <!-- Sidebar -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar glass" id="sidebar">
        <div class="menu-item" onclick="navigate('home')"><i class="fas fa-home"></i> Beranda</div>
        <div class="menu-item" onclick="navigate('products')"><i class="fas fa-shopping-cart"></i> Produk</div>
        <div class="menu-item" onclick="navigate('news')"><i class="fas fa-newspaper"></i> Pengumuman</div>
        <div class="menu-item" id="menu-orders" onclick="navigate('orders')" style="display:none;"><i class="fas fa-receipt"></i> Pesanan Saya</div>
        <div class="menu-item" id="menu-admin" onclick="navigate('admin')" style="display:none;"><i class="fas fa-cogs"></i> Admin Panel</div>
        <div class="menu-item" onclick="navigate('adminLogin')"><i class="fas fa-user-shield"></i> Login Admin</div>
        <div class="menu-item text-accent" id="menu-logout" onclick="logout()" style="display:none;"><i class="fas fa-sign-out-alt"></i> Logout</div>
    </div>

    <!-- Main Content Area -->
    <main id="app-content">
        <!-- Content injected via JS -->
    </main>

    <!-- Floating Socials -->
    <div class="social-float">
        <a href="https://tiktok.com/@manjiixit" target="_blank" class="social-btn" title="TikTok"><i class="fab fa-tiktok"></i></a>
        <a href="https://wa.me/6283845203074" target="_blank" class="social-btn" title="WhatsApp / Customer Service"><i class="fab fa-whatsapp"></i></a>
        <button class="social-btn" onclick="toggleChat()" id="chat-toggle-btn" style="display:none;" title="Live Chat"><i class="fas fa-comments"></i></button>
    </div>

    <!-- Chat Widget -->
    <div class="chat-widget glass" id="chatWidget">
        <div class="chat-header">Live Chat <span style="float:right; cursor:pointer;" onclick="toggleChat()"><i class="fas fa-times"></i></span></div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="Ketik pesan..." onkeypress="handleChatEnter(event)">
            <button class="btn-glass" style="padding: 5px 10px;" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // --- DATABASE SIMULATION (LocalStorage to mimic database.json) ---
        const DB_KEY = 'manjii_official_db';
        let db = JSON.parse(localStorage.getItem(DB_KEY));

        if (!db) {
            db = {
                siteName: 'MANJII OFFICIAL',
                siteDesc: 'Selamat datang di komunitas MANJII iOS. Tempat terbaik untuk mendapatkan cheat manjii ios dan tools optimalisasi berkualitas tinggi.',
                users: [], // { username, password }
                products: [
                    { id: 1, name: 'MANJII OVERLORD Injector', price: 50000, type: 'VIP', duration: 'Permanent / Anti Durasi', desc: 'Pengoptimalan rasio headshot, meringankan drag, memaksimalkan performance hp.' },
                    { id: 2, name: 'Script Auto Settings Free Fire', price: 25000, type: 'Script', duration: '30 Hari', desc: 'Generate sensivitas dan setingan otomatis untuk Android, iPad, dan iPhone.' },
                    { id: 3, name: 'Trading Bot Analytics Premium', price: 150000, type: 'Bot Telegram', duration: 'Permanent', desc: 'Bot membaca screenshoot market dan memberikan laporan hasil analisis.' }
                ],
                orders: [], // { id, username, wa, productId, status, date }
                news: [
                    { id: 1, date: new Date().toLocaleDateString(), text: 'Selamat datang di MANJII OFFICIAL! Sistem otomatis kami siap melayani Anda 24/7.' }
                ],
                chats: {} // { username: [{sender: 'user'|'admin', text, date}] }
            };
            saveDB();
        }

        function saveDB() {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        // --- STATE ---
        let currentUser = null; // { username, isAdmin }
        let currentSlide = 0;

        // --- CORE FUNCTIONS ---
        function changeAccentColor(e) {
            const color = e.target.value;
            document.documentElement.style.setProperty('--accent', color);
            localStorage.setItem('manjii_accent', color);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebar-overlay').classList.toggle('active');
        }

        function showLoading(text = 'MEMUAT...', duration = 800) {
            const loader = document.getElementById('loader');
            document.getElementById('loader-text').innerText = text;
            loader.style.display = 'flex';
            loader.style.opacity = '1';
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }, duration);
        }

        function updateNavUI() {
            const authBtn = document.getElementById('auth-btn');
            const menuOrders = document.getElementById('menu-orders');
            const menuAdmin = document.getElementById('menu-admin');
            const menuLogout = document.getElementById('menu-logout');
            const chatBtn = document.getElementById('chat-toggle-btn');
            document.getElementById('nav-logo').innerText = db.siteName;
            document.title = db.siteName;

            if (currentUser) {
                authBtn.innerHTML = `<i class="fas fa-user-circle"></i> ${currentUser.username}`;
                authBtn.onclick = () => {}; // disabled click when logged in
                menuLogout.style.display = 'block';
                
                if (currentUser.isAdmin) {
                    menuAdmin.style.display = 'block';
                    menuOrders.style.display = 'none';
                    chatBtn.style.display = 'none';
                } else {
                    menuAdmin.style.display = 'none';
                    menuOrders.style.display = 'block';
                    chatBtn.style.display = 'flex';
                }
            } else {
                authBtn.innerHTML = `<i class="fas fa-user"></i> Login`;
                authBtn.onclick = () => navigate('auth');
                menuLogout.style.display = 'none';
                menuAdmin.style.display = 'none';
                menuOrders.style.display = 'none';
                chatBtn.style.display = 'none';
                document.getElementById('chatWidget').style.display = 'none';
            }
        }

        function navigate(page, data = null) {
            showLoading();
            if(document.getElementById('sidebar').classList.contains('active')) toggleSidebar();
            
            setTimeout(() => {
                const content = document.getElementById('app-content');
                content.innerHTML = '';
                
                switch(page) {
                    case 'home': renderHome(content); break;
                    case 'products': renderProducts(content); break;
                    case 'news': renderNews(content); break;
                    case 'auth': renderAuth(content); break;
                    case 'adminLogin': renderAdminLogin(content); break;
                    case 'checkout': renderCheckout(content, data); break;
                    case 'orders': renderOrders(content); break;
                    case 'admin': renderAdmin(content); break;
                    default: renderHome(content);
                }
                updateNavUI();
            }, 300);
        }

        // --- VIEWS ---
        function renderHome(container) {
            let html = `
                <div class="carousel-container">
                    <div class="carousel-slide active" style="background-image: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=80');">
                        <div class="carousel-text">
                            <h2 class="neon-text">${db.siteName}</h2>
                            <p>Dominating the market for over 3 years</p>
                        </div>
                    </div>
                    <div class="carousel-slide" style="background-image: url('https://images.unsplash.com/photo-1552820728-8b83bb6b773f?auto=format&fit=crop&w=1200&q=80');">
                        <div class="carousel-text">
                            <h2 class="neon-text">100% SECURE</h2>
                            <p>Safe & encrypted system</p>
                        </div>
                    </div>
                    <div class="carousel-slide" style="background-image: url('https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=1200&q=80');">
                        <div class="carousel-text">
                            <h2 class="neon-text">INSTANT DELIVERY</h2>
                            <p>Get your access immediately after payment</p>
                        </div>
                    </div>
                </div>
                <div class="glass" style="padding: 30px; text-align: center;">
                    <h2 class="neon-text mb-2">TENTANG KAMI</h2>
                    <p style="color: var(--text-muted); line-height: 1.8;">${db.siteDesc}</p>
                    <br>
                    <button class="btn-glass" onclick="navigate('products')"><i class="fas fa-rocket"></i> Lihat Produk Kami</button>
                </div>
            `;
            container.innerHTML = html;
            startCarousel();
        }

        let carouselInterval;
        function startCarousel() {
            clearInterval(carouselInterval);
            let slides = document.querySelectorAll('.carousel-slide');
            if(slides.length === 0) return;
            carouselInterval = setInterval(() => {
                slides.forEach(s => s.classList.remove('active'));
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }, 3000);
        }

        function renderProducts(container) {
            let html = `<h2 class="neon-text mb-2 text-center">KATALOG PRODUK</h2><div class="grid">`;
            db.products.forEach(p => {
                html += `
                    <div class="card glass">
                        <div class="card-header">
                            <span class="badge"><i class="fas fa-tag"></i> ${p.type}</span>
                            <span class="badge" style="background: rgba(255,255,255,0.1); border-color: gray; color: white;">${p.duration}</span>
                        </div>
                        <h3 class="mt-2" style="font-size: 18px;">${p.name}</h3>
                        <p style="font-size: 13px; color: var(--text-muted); flex: 1;">${p.desc}</p>
                        <h3 class="text-accent mt-2">Rp ${p.price.toLocaleString('id-ID')}</h3>
                        <button class="btn-glass mt-2" style="width: 100%;" onclick="handleBuyClick(${p.id})"><i class="fas fa-shopping-cart"></i> Beli Sekarang</button>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        function handleBuyClick(id) {
            if (!currentUser) {
                alert("Silakan login atau daftar terlebih dahulu untuk melakukan pembelian.");
                navigate('auth');
            } else if (currentUser.isAdmin) {
                alert("Admin tidak dapat melakukan checkout.");
            } else {
                navigate('checkout', id);
            }
        }

        function renderCheckout(container, productId) {
            const p = db.products.find(x => x.id === productId);
            if (!p) return navigate('products');

            let html = `
                <div class="glass mx-auto" style="max-width: 600px; padding: 30px; margin: 0 auto;">
                    <h2 class="neon-text text-center mb-2">CHECKOUT PEMBELIAN</h2>
                    <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid var(--accent);">
                        <h3>${p.name}</h3>
                        <p class="text-muted" style="font-size:14px;">Durasi: ${p.duration} | Tipe: ${p.type}</p>
                        <h3 class="text-accent mt-2">Total: Rp ${p.price.toLocaleString('id-ID')}</h3>
                    </div>

                    <div class="input-group">
                        <label>Username Anda</label>
                        <input type="text" id="co-username" class="input-glass" value="${currentUser.username}" readonly>
                    </div>
                    <div class="input-group">
                        <label>Nomor WhatsApp Aktif</label>
                        <input type="number" id="co-wa" class="input-glass" placeholder="Contoh: 08123456789" required>
                    </div>

                    <div class="text-center mt-2" id="qris-section" style="display:none;">
                        <h4 class="neon-text">Scan QRIS All Pay</h4>
                        <p style="font-size: 12px; color: gray;">Harap gunakan file qris.png yang ada di repositori Anda</p>
                        <img src="qris.png" alt="QRIS PAYMENT" class="qris-img" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x300.png?text=QRIS+IMAGE+NOT+FOUND';">
                        <p class="text-muted mt-2" style="font-size: 14px;">Setelah transfer, klik konfirmasi di bawah ini. Status akan menjadi PENDING hingga admin ACC.</p>
                        <button class="btn-glass mt-2" style="width: 100%; background: #28a745; border-color: #28a745;" onclick="processCheckout(${p.id})"><i class="fas fa-check-circle"></i> Saya Sudah Bayar</button>
                    </div>

                    <button class="btn-glass mt-2" id="btn-show-qris" style="width: 100%;" onclick="showQRIS()"><i class="fas fa-qrcode"></i> Lanjutkan Pembayaran</button>
                </div>
            `;
            container.innerHTML = html;
        }

        function showQRIS() {
            const wa = document.getElementById('co-wa').value;
            if(!wa) return alert('Harap isi nomor WhatsApp yang aktif!');
            document.getElementById('btn-show-qris').style.display = 'none';
            document.getElementById('co-wa').setAttribute('readonly', true);
            document.getElementById('qris-section').style.display = 'block';
        }

        function processCheckout(productId) {
            const wa = document.getElementById('co-wa').value;
            const order = {
                id: 'ORD-' + Math.floor(Math.random() * 1000000),
                username: currentUser.username,
                wa: wa,
                productId: productId,
                productName: db.products.find(x => x.id === productId).name,
                status: 'PENDING',
                date: new Date().toLocaleString()
            };
            db.orders.push(order);
            saveDB();
            showLoading('MEMPROSES PESANAN...', 1500);
            setTimeout(() => {
                alert('Pesanan berhasil dibuat! Menunggu konfirmasi Admin.');
                navigate('orders');
            }, 1500);
        }

        function renderOrders(container) {
            const myOrders = db.orders.filter(o => o.username === currentUser.username);
            let html = `<div class="glass" style="padding: 20px;"><h2 class="neon-text mb-2">PESANAN SAYA</h2>`;
            if(myOrders.length === 0) {
                html += `<p class="text-muted">Anda belum memiliki pesanan.</p>`;
            } else {
                html += `<div style="overflow-x: auto;"><table><tr><th>ID Pesanan</th><th>Produk</th><th>Tanggal</th><th>Status</th></tr>`;
                myOrders.reverse().forEach(o => {
                    let color = o.status === 'DONE' ? '#28a745' : (o.status === 'PENDING' ? '#ffc107' : 'red');
                    html += `<tr>
                        <td>${o.id}</td>
                        <td>${o.productName}</td>
                        <td>${o.date}</td>
                        <td style="color: ${color}; font-weight: bold;">${o.status}</td>
                    </tr>`;
                });
                html += `</table></div>`;
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderNews(container) {
            let html = `<div class="glass mx-auto" style="max-width: 800px; padding: 20px;"><h2 class="neon-text mb-2 text-center"><i class="fas fa-bullhorn"></i> PENGUMUMAN PENTING</h2>`;
            if(!currentUser) {
                html += `<div class="text-center p-2"><p>Silakan login untuk melihat pengumuman.</p><button class="btn-glass mt-2" onclick="navigate('auth')">Login</button></div></div>`;
                container.innerHTML = html; return;
            }
            if(db.news.length === 0) html += `<p class="text-center text-muted">Belum ada pengumuman.</p>`;
            db.news.slice().reverse().forEach(n => {
                html += `
                    <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 3px solid var(--accent);">
                        <small style="color: var(--accent);">${n.date}</small>
                        <p class="mt-2" style="font-size: 15px; line-height: 1.6;">${n.text}</p>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        // --- AUTHENTICATION ---
        function renderAuth(container) {
            container.innerHTML = `
                <div class="glass mx-auto" style="max-width: 400px; padding: 30px; margin: 50px auto;">
                    <div id="login-form">
                        <h2 class="neon-text text-center mb-2">LOGIN PENGGUNA</h2>
                        <div class="input-group">
                            <label>Username</label>
                            <input type="text" id="log-user" class="input-glass" placeholder="Username Anda">
                        </div>
                        <div class="input-group">
                            <label>Password</label>
                            <input type="password" id="log-pass" class="input-glass" placeholder="Password Anda">
                        </div>
                        <button class="btn-glass mt-2" style="width:100%;" onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> Masuk</button>
                        <p class="text-center mt-2" style="font-size: 13px; color: var(--text-muted);">
                            Belum punya akun? <a href="#" style="color: var(--accent);" onclick="toggleAuth()">Daftar Disini</a>
                        </p>
                    </div>

                    <div id="reg-form" style="display:none;">
                        <h2 class="neon-text text-center mb-2">DAFTAR AKUN BARU</h2>
                        <div class="input-group">
                            <label>Username (Tanpa Spasi)</label>
                            <input type="text" id="reg-user" class="input-glass" placeholder="Username Baru">
                        </div>
                        <div class="input-group">
                            <label>Password</label>
                            <input type="password" id="reg-pass" class="input-glass" placeholder="Password Baru">
                        </div>
                        <button class="btn-glass mt-2" style="width:100%;" onclick="doRegister()"><i class="fas fa-user-plus"></i> Daftar</button>
                        <p class="text-center mt-2" style="font-size: 13px; color: var(--text-muted);">
                            Sudah punya akun? <a href="#" style="color: var(--accent);" onclick="toggleAuth()">Login Disini</a>
                        </p>
                    </div>
                </div>
            `;
        }

        function toggleAuth() {
            const lf = document.getElementById('login-form');
            const rf = document.getElementById('reg-form');
            if(lf.style.display === 'none') { lf.style.display = 'block'; rf.style.display = 'none'; }
            else { lf.style.display = 'none'; rf.style.display = 'block'; }
        }

        function doRegister() {
            const u = document.getElementById('reg-user').value.trim();
            const p = document.getElementById('reg-pass').value;
            if(!u || !p || u.includes(' ')) return alert('Username (tanpa spasi) dan Password wajib diisi!');
            
            if(db.users.find(x => x.username === u)) return alert('Username sudah terdaftar!');
            
            db.users.push({ username: u, password: p });
            saveDB();
            alert('Pendaftaran berhasil! Silakan Login.');
            toggleAuth();
        }

        function doLogin() {
            const u = document.getElementById('log-user').value.trim();
            const p = document.getElementById('log-pass').value;
            const user = db.users.find(x => x.username === u && x.password === p);
            if(user) {
                currentUser = { username: u, isAdmin: false };
                showLoading('BERHASIL LOGIN...', 1000);
                setTimeout(() => navigate('home'), 1000);
            } else {
                alert('Username atau password salah!');
            }
        }

        function renderAdminLogin(container) {
            container.innerHTML = `
                <div class="glass mx-auto" style="max-width: 400px; padding: 30px; margin: 50px auto; border-color: red; box-shadow: 0 0 20px rgba(255,0,0,0.2);">
                    <h2 class="text-center mb-2" style="color: red; text-shadow: 0 0 10px red;"><i class="fas fa-shield-alt"></i> ADMIN PANEL</h2>
                    <p class="text-center text-muted" style="font-size:12px; margin-bottom: 15px;">Area Terbatas. Default: admin_manjii_escobar / Overlord2026!</p>
                    <div class="input-group">
                        <label>Admin Username</label>
                        <input type="text" id="admin-user" class="input-glass" style="border-color: rgba(255,0,0,0.5);">
                    </div>
                    <div class="input-group">
                        <label>Admin Password</label>
                        <input type="password" id="admin-pass" class="input-glass" style="border-color: rgba(255,0,0,0.5);">
                    </div>
                    <button class="btn-glass mt-2" style="width:100%; background: rgba(255,0,0,0.2); border-color: red;" onclick="doAdminLogin()"><i class="fas fa-sign-in-alt"></i> Login Admin</button>
                </div>
            `;
        }

        function doAdminLogin() {
            const u = document.getElementById('admin-user').value;
            const p = document.getElementById('admin-pass').value;
            // Hardcoded secure admin credentials based on profile setup
            if(u === 'admin_manjii_escobar' && p === 'Overlord2026!') {
                currentUser = { username: 'ADMIN', isAdmin: true };
                showLoading('MENGAKSES PANEL ADMIN...', 1500);
                setTimeout(() => navigate('admin'), 1500);
            } else {
                alert('Akses Ditolak! Kredensial tidak valid.');
            }
        }

        function logout() {
            currentUser = null;
            showLoading('LOGOUT...', 1000);
            setTimeout(() => navigate('home'), 1000);
        }

        // --- ADMIN PANEL ---
        function renderAdmin(container) {
            if(!currentUser || !currentUser.isAdmin) return navigate('home');

            let html = `
                <div class="glass" style="padding: 20px;">
                    <h2 class="neon-text mb-2"><i class="fas fa-cogs"></i> DASHBOARD ADMIN</h2>
                    
                    <!-- Web Settings -->
                    <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                        <h3 class="text-accent mb-2">Pengaturan Website</h3>
                        <div style="display:flex; gap:10px;">
                            <input type="text" id="cfg-name" class="input-glass" value="${db.siteName}" placeholder="Nama Website">
                            <input type="text" id="cfg-desc" class="input-glass" value="${db.siteDesc}" placeholder="Deskripsi Singkat">
                            <button class="btn-glass" onclick="updateSiteCfg()">Update</button>
                            <button class="btn-glass" onclick="downloadDatabase()" style="background:#28a745; border-color:#28a745;" title="Download database.json"><i class="fas fa-download"></i> DB</button>
                        </div>
                    </div>

                    <!-- Add Product / News Tabs -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        
                        <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px;">
                            <h3 class="text-accent mb-2">Tambah Produk</h3>
                            <input type="text" id="add-p-name" class="input-glass mb-2" placeholder="Nama Produk">
                            <input type="number" id="add-p-price" class="input-glass mb-2" placeholder="Harga (Angka)">
                            <input type="text" id="add-p-type" class="input-glass mb-2" placeholder="Tipe (Cth: APK, Script)">
                            <input type="text" id="add-p-dur" class="input-glass mb-2" placeholder="Durasi (Cth: Anti Durasi, 30 Hari)">
                            <textarea id="add-p-desc" class="input-glass mb-2" placeholder="Deskripsi"></textarea>
                            <button class="btn-glass" onclick="addAdminProduct()">Tambah Produk</button>
                        </div>

                        <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px;">
                            <h3 class="text-accent mb-2">Tambah Pengumuman (News)</h3>
                            <textarea id="add-n-text" class="input-glass mb-2" style="height: 150px;" placeholder="Ketik pengumuman di sini..."></textarea>
                            <button class="btn-glass" onclick="addAdminNews()">Publikasikan</button>
                        </div>

                    </div>

                    <!-- Orders Table -->
                    <h3 class="text-accent mb-2">Daftar Checkout / Pesanan</h3>
                    <div style="overflow-x: auto; margin-bottom: 30px;">
                        <table>
                            <tr><th>ID</th><th>User</th><th>WA</th><th>Produk</th><th>Status</th><th>Aksi</th></tr>
                            ${db.orders.slice().reverse().map(o => `
                                <tr>
                                    <td>${o.id}</td>
                                    <td>${o.username}</td>
                                    <td>${o.wa}</td>
                                    <td>${o.productName}</td>
                                    <td style="color: ${o.status==='PENDING'?'#ffc107':'#28a745'};">${o.status}</td>
                                    <td>
                                        ${o.status === 'PENDING' ? `<button class="btn-glass" style="padding: 5px; font-size:12px; background: #28a745; border:none;" onclick="accOrder('${o.id}')">ACC (DONE)</button>` : '-'}
                                    </td>
                                </tr>
                            `).join('')}
                        </table>
                    </div>

                    <!-- Products Table -->
                    <h3 class="text-accent mb-2">Kelola Produk</h3>
                    <div style="overflow-x: auto; margin-bottom: 30px;">
                        <table>
                            <tr><th>ID</th><th>Nama</th><th>Harga</th><th>Durasi</th><th>Aksi</th></tr>
                            ${db.products.map(p => `
                                <tr>
                                    <td>${p.id}</td>
                                    <td>${p.name}</td>
                                    <td>Rp ${p.price}</td>
                                    <td>${p.duration}</td>
                                    <td><button class="btn-glass" style="padding: 5px; font-size:12px; background: red; border:none;" onclick="delAdminProduct(${p.id})">Hapus</button></td>
                                </tr>
                            `).join('')}
                        </table>
                    </div>

                    <!-- News Table -->
                    <h3 class="text-accent mb-2">Kelola Pengumuman</h3>
                    <div style="overflow-x: auto; margin-bottom: 30px;">
                        <table>
                            <tr><th>Tanggal</th><th>Isi</th><th>Aksi</th></tr>
                            ${db.news.map(n => `
                                <tr>
                                    <td>${n.date}</td>
                                    <td>${n.text.substring(0, 50)}...</td>
                                    <td><button class="btn-glass" style="padding: 5px; font-size:12px; background: red; border:none;" onclick="delAdminNews(${n.id})">Hapus</button></td>
                                </tr>
                            `).join('')}
                        </table>
                    </div>

                    <!-- Users Database -->
                    <h3 class="text-accent mb-2">Database Akun User</h3>
                    <div style="overflow-x: auto;">
                        <table>
                            <tr><th>No</th><th>Username</th><th>Password</th></tr>
                            ${db.users.map((u, i) => `
                                <tr>
                                    <td>${i+1}</td>
                                    <td>${u.username}</td>
                                    <td style="font-family: monospace; color: #ffeb3b;">${u.password}</td>
                                </tr>
                            `).join('')}
                        </table>
                    </div>

                </div>
            `;
            container.innerHTML = html;
        }

        // Admin Actions
        function updateSiteCfg() {
            db.siteName = document.getElementById('cfg-name').value;
            db.siteDesc = document.getElementById('cfg-desc').value;
            saveDB();
            updateNavUI();
            alert('Pengaturan Website Disimpan!');
        }

        function downloadDatabase() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href",     dataStr     );
            dlAnchorElem.setAttribute("download", "database.json");
            dlAnchorElem.click();
        }

        function accOrder(id) {
            let o = db.orders.find(x => x.id === id);
            if(o) { o.status = 'DONE'; saveDB(); renderAdmin(document.getElementById('app-content')); }
        }

        function addAdminProduct() {
            const name = document.getElementById('add-p-name').value;
            const price = parseInt(document.getElementById('add-p-price').value);
            const type = document.getElementById('add-p-type').value;
            const dur = document.getElementById('add-p-dur').value;
            const desc = document.getElementById('add-p-desc').value;
            if(!name || !price) return alert('Nama dan Harga wajib diisi!');
            
            db.products.push({
                id: Date.now(), name, price, type, duration: dur, desc
            });
            saveDB();
            alert('Produk berhasil ditambahkan!');
            renderAdmin(document.getElementById('app-content'));
        }

        function delAdminProduct(id) {
            if(confirm('Yakin hapus produk ini?')) {
                db.products = db.products.filter(x => x.id !== id);
                saveDB();
                renderAdmin(document.getElementById('app-content'));
            }
        }

        function addAdminNews() {
            const text = document.getElementById('add-n-text').value;
            if(!text) return;
            db.news.push({ id: Date.now(), date: new Date().toLocaleDateString(), text });
            saveDB();
            alert('Pengumuman dipublikasikan!');
            renderAdmin(document.getElementById('app-content'));
        }

        function delAdminNews(id) {
            if(confirm('Yakin hapus pengumuman ini?')) {
                db.news = db.news.filter(x => x.id !== id);
                saveDB();
                renderAdmin(document.getElementById('app-content'));
            }
        }


        // --- LIVE CHAT SYSTEM (Simulated) ---
        function toggleChat() {
            const chat = document.getElementById('chatWidget');
            if(chat.style.display === 'flex') {
                chat.style.display = 'none';
            } else {
                chat.style.display = 'flex';
                renderChatMessages();
            }
        }

        function renderChatMessages() {
            if(!currentUser) return;
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            
            // Generate automated greeting if empty
            if(!db.chats[currentUser.username]) {
                db.chats[currentUser.username] = [
                    { sender: 'admin', text: 'Halo! Ada yang bisa kami bantu? Customer Service MANJII OFFICIAL siap melayani.', date: new Date().toLocaleTimeString() }
                ];
                saveDB();
            }

            db.chats[currentUser.username].forEach(m => {
                const div = document.createElement('div');
                div.className = `msg ${m.sender}`;
                div.innerHTML = `<div>${m.text}</div><div style="font-size: 10px; text-align:right; margin-top:4px; opacity:0.7;">${m.date}</div>`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if(!text || !currentUser) return;

            db.chats[currentUser.username].push({ sender: 'user', text, date: new Date().toLocaleTimeString() });
            input.value = '';
            saveDB();
            renderChatMessages();

            // Simulate auto reply from admin
            setTimeout(() => {
                if(db.chats[currentUser.username]) {
                    db.chats[currentUser.username].push({ sender: 'admin', text: 'Terima kasih telah menghubungi kami. Pesan Anda sedang dalam antrean balasan Admin. Anda juga bisa hubungi WA 083845203074.', date: new Date().toLocaleTimeString() });
                    saveDB();
                    renderChatMessages();
                }
            }, 2000);
        }

        function handleChatEnter(e) { if(e.key === 'Enter') sendMessage(); }


        // --- INITIALIZATION ---
        window.onload = () => {
            // Restore Accent Color
            const savedColor = localStorage.getItem('manjii_accent');
            if(savedColor) {
                document.documentElement.style.setProperty('--accent', savedColor);
                document.getElementById('colorPicker').value = savedColor;
            }
            
            updateNavUI();
            setTimeout(() => {
                navigate('home');
            }, 500);
        };
    </script>
</body>
</html>

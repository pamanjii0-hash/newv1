
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - MANJII</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loading-screen"><div class="spinner"></div></div>

    <nav class="glass">
        <div class="logo">ADMIN PANEL</div>
        <div class="nav-links" id="admin-nav" style="display: none;">
            <button class="glass-btn" onclick="adminLogout()">Logout Admin</button>
        </div>
    </nav>

    <!-- ADMIN LOGIN -->
    <div id="page-admin-login" class="page active">
        <div class="glass" style="max-width: 400px; margin: 0 auto; padding: 30px; border-color: red;">
            <h2>Secure Admin Login</h2>
            <div class="form-group">
                <label>Admin Username</label>
                <input type="text" id="admin-user">
            </div>
            <div class="form-group">
                <label>Secret Password</label>
                <input type="password" id="admin-pass">
            </div>
            <button class="glass-btn" style="width: 100%; background: rgba(255,0,0,0.2);" onclick="adminLogin()">Access Panel</button>
        </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="page-admin-dash" class="page">
        <h2>Dashboard Admin</h2>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
            <!-- Website Settings -->
            <div class="glass" style="padding: 20px;">
                <h3>Website Settings</h3>
                <div class="form-group"><label>Website Name</label><input type="text" id="set-name"></div>
                <div class="form-group"><label>Description</label><textarea id="set-desc"></textarea></div>
                <div class="form-group"><label>News/Pengumuman</label><textarea id="set-news"></textarea></div>
                <button class="glass-btn" onclick="saveSettings()">Save Settings</button>
            </div>

            <!-- Manage Products -->
            <div class="glass" style="padding: 20px;">
                <h3>Manage Products</h3>
                <div class="form-group"><label>Nama Produk</label><input type="text" id="prod-name"></div>
                <div class="form-group"><label>Harga ($)</label><input type="number" id="prod-price" step="0.01"></div>
                <div class="form-group"><label>Durasi/Variant</label><input type="text" id="prod-dur"></div>
                <button class="glass-btn" onclick="addProduct()">Add Product</button>
                <div id="admin-product-list" style="margin-top: 15px; max-height: 200px; overflow-y: auto;"></div>
            </div>

            <!-- Order Management -->
            <div class="glass" style="padding: 20px;">
                <h3>Checkout / Orders</h3>
                <div id="admin-orders" style="max-height: 300px; overflow-y: auto;"></div>
            </div>

            <!-- Database Akun User -->
            <div class="glass" style="padding: 20px;">
                <h3>Database Akun User</h3>
                <div id="admin-users" style="max-height: 150px; overflow-y: auto; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;"></div>
                
                <h3 style="margin-top:20px;">Live Chat Support</h3>
                <div class="form-group">
                    <select id="chat-user-select" onchange="loadAdminChat()"><option value="">Select User</option></select>
                </div>
                <div class="chat-box" id="admin-chat-box"></div>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="admin-chat-input" style="width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; padding: 10px;" placeholder="Balas...">
                    <button class="glass-btn" onclick="sendChatAdmin()">Kirim</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
